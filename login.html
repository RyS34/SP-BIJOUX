<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - SP BIJOUX</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /*Estilos generales */
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background:
                radial-gradient(circle at top left, rgba(201, 160, 220, 0.35), transparent 30%),
                radial-gradient(circle at bottom right, rgba(255, 192, 203, 0.25), transparent 30%),
                linear-gradient(135deg, #4e0b28 0%, #5b2972 50%, #aa9595 100%);
            /* Un fondo degradado elegante */
            position: relative;
        }

        /* Glow background */
        .blur {
            position: absolute;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.5;
            z-index: 0;
        }

        /* Colores y posiciones para los glows */
        .blur-1 {
            background: #5f0c68;
            top: -100px;
            left: -100px;
        }

        .blur-2 {
            background: #e8aae4;
            bottom: -120px;
            right: -100px;
        }

        /* Card */
        .login-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 2;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 50px 40px;
            border-radius: 28px;

            /* FONDO: Efecto de cristal translúcido */
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);

            /* BORDE: Muy fino y elegante */
            border: 1px solid rgba(255, 255, 255, 0.5);

            /* MARCA DE AGUA: El logo SP gigante pero muy suave */
            background-image: url('assets/logo_sin_pie_de_pagina.png');
            background-size: 200%;
            background-repeat: no-repeat;
            background-position: center;
            background-blend-mode: soft-light;
            /* Esto hace que se funda con el fondo */

            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
        }

        /*Un borde degradado sutil en la parte superior para dar un toque de lujo 
        .login-box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 10px;
            background: linear-gradient(90deg, #d52d0c, #36096d);
        }*/

        /*Estilos para la sección de la marca */
        .brand {
            text-align: center;
            margin-bottom: 35px;
        }

        /*Estilos para el título y subtítulo de la marca */
        .brand h1 {
            font-size: 35px;
            color: #000000;
            letter-spacing: 2px;
            font-weight: 700;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.1);
        }

        /*Estilos para las etiquetas de los inputs */
        .input-group label {
            color: #c71c1c;
            font-weight: 600;
        }

        .brand p {
            margin-top: 8px;
            color: #020000;
            font-size: 15px;
        }

        .luxury-icon {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            padding: 10px;
            background: #ffffff;
            border-radius: 22px;
            /* Esquinas suavizadas (estilo Apple) */
            display: flex;
            justify-content: center;
            align-items: center;

            /* BORDE MANUAL: Sutil para que resalte la imagen */
            border: 1.5px solid #f0e6f5;
            box-shadow: 0 10px 20px rgba(201, 160, 220, 0.2);
        }

        .luxury-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }


        /*Estilos para el formulario */
        .input-group {
            margin-bottom: 20px;
        }

        /*Estilos para las etiquetas de los inputs */
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #000000;
            font-size: 17px;
            font-weight: 600;

        }

        /*Contenedor para los inputs, necesario para el efecto de foco */
        .input-wrapper {
            position: relative;
        }

        /*Estilos para los inputs */
        .input-wrapper input {
            width: 100%;
            padding: 16px 18px;
            border-radius: 16px;
            border: 1px solid rgba(0, 0, 0, 0.08);
            background: rgba(255, 255, 255, 0.9);
            outline: none;
            font-size: 15px;
            transition: all 0.3s ease;
            color: #000000;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);

        }

        /*Efecto de foco para los inputs */
        .input-wrapper input:focus {
            border-color: #470a44;
            box-shadow: 0 0 0 5px rgba(201, 160, 220, 0.15);
            transform: translateY(-2px);
        }

        /*Estilos para el placeholder*/
        .input-wrapper input::placeholder {
            color: #676767;
        }

        /*Estilos para el botón de login */
        .login-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 18px;
            background: linear-gradient(135deg, #ca86ea, #503f5a);
            color: rgb(255, 255, 255);
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.35s ease;
            box-shadow: 0 10px 25px rgba(201, 160, 220, 0.35);
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(111, 15, 155, 0.45);
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .error {
            color: #6c1123;
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            font-weight: 500;
        }

        /*Estilos para el texto del footer */
        .footer-text {
            margin-top: 30px;
            text-align: center;
            font-size: 14px;
            color: #000000;
        }

        .footer-text span {
            color: #090000;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 500px) {

            .login-box {
                padding: 35px 25px;
                border-radius: 24px;
            }

            .brand h1 {
                font-size: 28px;
            }

            .luxury-icon {
                width: 75px;
                height: 75px;
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <!-- Background Effects -->
    <div class="blur blur-1"></div>
    <div class="blur blur-2"></div>

    <div class="login-container">

        <div class="login-box">

            <div class="brand">
                <div class="luxury-icon">
                    <img src="assets/logo_principal.png" alt="Logo" style="width: 100%;height: 120%; 
               object-fit: contain;
               border: 0px solid #c9a0dc; 
               border-radius: 10%;
               padding: 0px;
        ">
                </div>
                <h1>SP BIJOUX</h1>
                <p>Panel administrativo</p>
            </div>

            <form id="login-form">

                <div class="input-group">
                    <label>Correo electrónico</label>

                    <div class="input-wrapper">
                        <input type="email" id="user" placeholder="Ingresa tu correo electrónico" required>
                    </div>
                </div>

                <div class="input-group">
                    <label>Contraseña</label>

                    <div class="input-wrapper">
                        <input type="password" id="pass" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="login-btn">
                    Ingresar al panel
                </button>

            </form>

            <p class="error" id="error"></p>

            <div class="footer-text">
                © 2026 <span>SP BIJOUX</span> — Todos los derechos reservados
            </div>

        </div>

    </div>

    <!-- LOGIN JS -->
    <script type="module" src="login.js"></script>

</body>

</html>
